[project]
name = "agentfeeds-catalog"
version = "0.1.0"
description = "Built-in provider catalog for Agent Feeds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "jsonschema>=4.22.0",
  "PyYAML>=6.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
